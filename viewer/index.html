<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anatomy Asset Viewer</title>
<style>
  :root { --bg: #14171c; --panel: #1f242c; --text: #e6e9ee; --muted: #9aa3ae; --accent: #f08a24; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  #ui { position: absolute; top: 12px; left: 12px; width: 260px; max-height: calc(100vh - 24px); overflow: auto; background: var(--panel);
        border-radius: 8px; padding: 12px 14px; box-sizing: border-box; }
  h1 { font-size: 15px; margin: 0 0 8px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 14px 0 6px; }
  label { display: flex; gap: 8px; align-items: center; margin: 3px 0; cursor: pointer; }
  input[type=range] { width: 100%; }
  #pick { font: 12px/1.45 ui-monospace, monospace; white-space: pre-wrap; color: var(--muted); }
  @media (max-width: 600px) { #ui { width: auto; right: 12px; max-height: 45vh; } }
</style>
</head>
<body>
<div id="ui">
  <h1>Crew Health Check — anatomy asset</h1>
  <div id="status">Loading GLB…</div>
  <h2>Systems</h2><div id="systems"></div>
  <label><input type="checkbox" id="xray"> See-through skin</label>
  <label><input type="checkbox" id="anchors"> Show sensor anchors</label>
  <label><input type="checkbox" id="deltoid"> Show right deltoid region</label>
  <h2>Animation controls</h2>
  <label>Heart_Contract</label><input type="range" id="heart" min="0" max="1" step="0.01" value="0">
  <label>Lungs_Inhale</label><input type="range" id="inhale" min="0" max="1" step="0.01" value="0">
  <label>Profile_B (outer body)</label><input type="range" id="profile" min="0" max="1" step="0.01" value="0">
  <label><input type="checkbox" id="animate"> Loop heart + breathing</label>
  <h2>Click the body</h2><div id="pick">Click the skin to read point, normal and region.</div>
</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
// Serve the project folder (e.g. `npx serve .` or `python3 -m http.server`) and open /viewer/index.html.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14171c);
const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.01, 50);
camera.position.set(0.9, 1.2, 3.6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.95, 0);
scene.add(new THREE.HemisphereLight(0xffffff, 0x334455, 1.6));
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(-1, 2, 3); scene.add(key);

const [regions, contract] = await Promise.all(['astronaut_body_regions.json', 'astronaut_visualization_contract.json']
  .map((f) => fetch('../manifests/' + f).then((r) => r.json())));
const regionName = Object.fromEntries(regions.regions.map((r) => [r.region_id, r.region_name]));
const gltf = await new GLTFLoader().loadAsync('../export/astronaut_digital_twin.glb');
const root = gltf.scene;
scene.add(root);
const node = (n) => root.getObjectByName(n);
document.getElementById('status').textContent = 'Loaded astronaut_digital_twin.glb';

// default presentation: assembled human, helpers hidden (glTF has no visibility flag: use extras.default_visible)
root.traverse((o) => { if (o.userData.default_visible === false) o.visible = false; });
const sysDiv = document.getElementById('systems');
for (const [key, group] of Object.entries(contract.system_group_nodes)) {
  const g = node(group); const on = key === 'external';
  g.visible = on;
  const l = document.createElement('label');
  l.innerHTML = `<input type="checkbox" ${on ? 'checked' : ''}> ${key}`;
  l.querySelector('input').onchange = (e) => { g.visible = e.target.checked; };
  sysDiv.appendChild(l);
}
const skin = node('BODY_Skin');
const solid = skin.material, glass = solid.clone();
glass.transparent = true; glass.opacity = 0.22; glass.depthWrite = false;
document.getElementById('xray').onchange = (e) => { skin.material = e.target.checked ? glass : solid; };
document.getElementById('anchors').onchange = (e) => {
  node('GROUP_SensorAnchors').visible = e.target.checked;
  node('GROUP_SensorAnchors').traverse((a) => {
    if (a.name.startsWith('ANCHOR_')) {
      a.visible = e.target.checked;
      if (!a.userData.marker) { a.userData.marker = true; a.add(new THREE.ArrowHelper(new THREE.Vector3(0, 0, 1), new THREE.Vector3(), 0.05, 0x22d3ee)); }
    }
  });
};
document.getElementById('deltoid').onchange = (e) => {
  node('GROUP_BodyRegions').visible = e.target.checked; node('REGION_SHOULDER_RIGHT_DELTOID').visible = e.target.checked;
};

const setMorph = (group, target, v) => contract.morph_targets[group].nodes.forEach((n) => {
  const m = node(n); const i = m?.morphTargetDictionary?.[target]; if (i !== undefined) m.morphTargetInfluences[i] = v;
});
const hs = document.getElementById('heart'), ls = document.getElementById('inhale'), ps = document.getElementById('profile');
hs.oninput = () => setMorph('heart', 'Heart_Contract', +hs.value);
ls.oninput = () => setMorph('lungs', 'Lungs_Inhale', +ls.value);
ps.oninput = () => setMorph('body_profile', 'Profile_B', +ps.value);

// surface picking: point + normal + region id; a soreness pin is stored in BODY_Skin local space
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
const pin = new THREE.Mesh(new THREE.SphereGeometry(0.008), new THREE.MeshBasicMaterial({ color: 0xf08a24 }));
pin.visible = false; skin.parent.add(pin);
renderer.domElement.addEventListener('pointerdown', (e) => {
  mouse.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObject(skin, false)[0];
  if (!hit) return;
  const id = skin.geometry.attributes._region_id.getX(hit.face.a);
  const sub = skin.geometry.attributes._subregion_id?.getX(hit.face.a);
  const local = skin.parent.worldToLocal(hit.point.clone());
  pin.position.copy(local); pin.visible = true;
  document.getElementById('pick').textContent =
    `region ${id} ${regionName[id]}${sub === 1 ? '\n(right deltoid sub-region)' : ''}\npoint  ${local.toArray().map((v) => v.toFixed(3)).join(', ')}\nnormal ${hit.face.normal.toArray().map((v) => v.toFixed(2)).join(', ')}`;
});

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  if (document.getElementById('animate').checked) {
    const t = clock.getElapsedTime();
    setMorph('heart', 'Heart_Contract', Math.max(0, Math.sin(t * Math.PI * 2 * 1.1)) ** 2);   // visual only, ~66 bpm
    setMorph('lungs', 'Lungs_Inhale', 0.5 - 0.5 * Math.cos(t * Math.PI * 2 / 4.5));
  }
  controls.update();
  renderer.render(scene, camera);
});
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
</script>
</body>
</html>
